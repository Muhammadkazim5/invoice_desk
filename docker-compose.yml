services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice-desk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-invoice_desk}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - invoice-desk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invoice-desk-pgdata:
